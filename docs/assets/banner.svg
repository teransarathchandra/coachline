<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">coachline</title>
  <desc id="desc">A side panel for Claude Code that coaches every prompt you send.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121f"/>
      <stop offset="1" stop-color="#2a2140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#f2b28f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" rx="20" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="118" fill="#ffffff" font-size="64" font-weight="700">coach<tspan fill="url(#accent)">line</tspan></text>
    <text x="74" y="166" fill="#d8d3ea" font-size="26">A side panel for Claude Code that coaches every prompt.</text>
    <g font-size="20" font-weight="600">
      <rect x="72" y="204" width="196" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.55"/>
      <text x="170" y="233" fill="#ffffff" text-anchor="middle">1 · Coach a prompt</text>
      <rect x="284" y="204" width="226" height="44" rx="22" fill="#89b4fa" fill-opacity="0.16" stroke="#89b4fa" stroke-opacity="0.65"/>
      <text x="397" y="233" fill="#dbe7ff" text-anchor="middle">2 · Copy a better one</text>
      <rect x="526" y="204" width="248" height="44" rx="22" fill="#94e2d5" fill-opacity="0.16" stroke="#94e2d5" stroke-opacity="0.65"/>
      <text x="650" y="233" fill="#d6f5ef" text-anchor="middle">3 · Learn from your chats</text>
    </g>
  </g>
  <!-- the panel: your prompt (white), Improve (blue), Enhanced prompt (cyan) -->
  <g transform="translate(900 38)" fill="none" stroke-width="2.5">
    <rect width="320" height="224" rx="14" fill="#1e1e2e" stroke="#6c7086" stroke-opacity="0.6"/>
    <rect x="18" y="18" width="284" height="38" rx="8" stroke="#ffffff" stroke-opacity="0.85"/>
    <rect x="32" y="33" width="150" height="8" rx="4" fill="#ffffff" stroke="none"/>
    <rect x="18" y="68" width="284" height="62" rx="8" stroke="#89b4fa"/>
    <rect x="32" y="83" width="200" height="7" rx="3.5" fill="#89b4fa" stroke="none"/>
    <rect x="32" y="97" width="170" height="7" rx="3.5" fill="#89b4fa" stroke="none" fill-opacity="0.75"/>
    <rect x="32" y="111" width="120" height="7" rx="3.5" fill="#89b4fa" stroke="none" fill-opacity="0.55"/>
    <rect x="18" y="142" width="284" height="64" rx="8" stroke="#94e2d5"/>
    <rect x="248" y="135" width="44" height="14" rx="4" fill="#3a5cc5" stroke="none"/>
    <rect x="32" y="158" width="230" height="7" rx="3.5" fill="#94e2d5" stroke="none"/>
    <rect x="32" y="172" width="210" height="7" rx="3.5" fill="#94e2d5" stroke="none" fill-opacity="0.75"/>
    <rect x="32" y="186" width="150" height="7" rx="3.5" fill="#94e2d5" stroke="none" fill-opacity="0.55"/>
  </g>
</svg>
