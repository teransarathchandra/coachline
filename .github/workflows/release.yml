name: release

# `claude plugin tag --push` pushes coachline--v<version> once plugin.json and the marketplace entry agree. This checks the tag
# against plugin.json, runs the tests and creates the GitHub release with that version's CHANGELOG notes. Claude Code installs
# from the repository itself, so there is nothing else to publish.
on:
  push:
    tags: ["coachline--v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      - name: Check the tag and take the CHANGELOG notes
        run: |
          python - "$GITHUB_REF_NAME" <<'PY'
          import json, re, sys
          tag = sys.argv[1]
          v = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))["version"]
          if tag != f"coachline--v{v}": sys.exit(f"tag {tag} does not match plugin.json version {v}")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(v)}\b.*\n((?:(?!^## ).*\n?)*)", text, re.M)
          if not m or not m.group(1).strip(): sys.exit(f"CHANGELOG.md has no notes under '## {v}'")
          open("notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          PY
      - run: python -W error::ResourceWarning -m unittest discover -s tests
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-pushed tag (history rewrite) keeps its release; only the first push creates it.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && { echo "release $GITHUB_REF_NAME already exists"; exit 0; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "coachline ${GITHUB_REF_NAME#coachline--}" --notes-file notes.md
